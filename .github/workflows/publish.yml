name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Stub graphify graph (207 nodes)
        run: |
          mkdir -p graphify-out
          node -e "require('fs').writeFileSync('graphify-out/graph.json', JSON.stringify({nodes: Array.from({length:207}, (_,i)=>({id: 'n'+i})), links: []}))"
          echo "graph stub 207 created"
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
