name: ci
on: [push, pull_request]
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install
      - run: pnpm typecheck
      - run: python -m pip install graphify 2>&1 | tail -n 1 || echo "graphify pip install skipped"
      - run: python -m graphify update . 2>&1 | tail -n 5 || echo "graphify update skipped (no LLM)"
      - run: pnpm test
      - run: pnpm demo
      - run: pnpm doctor
