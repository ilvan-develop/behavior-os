name: ci
on: [push, pull_request]
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install
      - run: pnpm typecheck
      - run: mkdir -p graphify-out && node -e "require('fs').writeFileSync('graphify-out/graph.json', JSON.stringify({nodes: Array.from({length:207}, (_,i)=>({id: 'n'+i})), links: []}))" && echo "graph stub 207 created"
      - run: pnpm test
      - run: pnpm demo
      - run: pnpm doctor
