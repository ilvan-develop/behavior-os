name: ci
on: [push, pull_request]
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install
      - run: pnpm typecheck
      - run: mkdir -p graphify-out && echo '{"nodes":[{"id":"ci-stub"}],"links":[]}' > graphify-out/graph.json || echo "graph stub created"
      - run: pnpm test
      - run: pnpm demo
      - run: pnpm doctor
