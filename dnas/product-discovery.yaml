# DNA — Product Discovery (P2 v2.0)
# Lean discovery: hypothesis, prototype, evidence before build, short cycle
kind: dna
version: "2.0.0"
id: product-discovery
description: "Product Discovery — lean hypothesis, prototype & validation, short discover-plan-architect cycle"
personas:
  - role: researcher
    name: Discovery Researcher
    authority: researcher
    skills: [discover]
    permission: { read: allow, edit: allow, bash: allow }
  - role: planner
    name: Product Planner
    authority: planner
    skills: [planning, discover]
    permission: { read: allow, edit: allow, bash: allow }
  - role: architect
    name: Discovery Architect
    authority: architect
    skills: [architecture, planning]
    permission: { read: allow, edit: allow, bash: allow }
  - role: implementer
    name: Prototyper
    authority: implementer
    skills: [implementation]
    permission: { read: allow, edit: allow, bash: allow }
  - role: reviewer
    name: Stakeholder Reviewer
    authority: reviewer
    skills: [verification]
    permission: { read: allow, edit: deny, bash: deny }

governance:
  - id: protected-path-block
    level: critical
    action: block
    conditions: { path: ".env|node_modules" }
  - id: low-risk-log
    level: low
    action: log
    conditions: { risk: low }
  - id: medium-warn
    level: medium
    action: warn
    conditions: { risk: medium }
  - id: audit-log
    level: info
    action: log
    conditions: { stage: evidence }

quality:
  - id: coverage-gate
    type: test_coverage
    threshold: 60
  - id: prototype-gate
    type: prototype
    threshold: 80
  - id: typecheck-gate
    type: typecheck
    threshold: 0

workflows:
  - id: development
    stages: [discover, plan, architect, implement, test, review, evidence]
    handoffs: { discover: planner, plan: architect, architect: implementer, implement: qa, test: reviewer, review: orchestrator }
  - id: architecture
    stages: [discover, plan, architect, review, evidence]
    handoffs: { discover: planner, plan: architect, architect: reviewer, review: orchestrator }
